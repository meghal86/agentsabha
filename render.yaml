databases:
  - name: agentsabha-db
    databaseName: agentsabha
    user: agentsabha
    plan: free

services:
  - type: web
    name: agentsabha-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c 'PYTHONPATH=. alembic upgrade head && PYTHONPATH=. python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agentsabha-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: agentsabha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AWS_REGION
        value: ap-south-1
      - key: CORRECT_CONSTITUENCY_MINIMUM_CLUSTER_SIZE
        value: "50"
      - key: TATKAL_SEVERITY_THRESHOLD
        value: "8.0"
      - key: TATKAL_NEW_REPORTS_THRESHOLD
        value: "50"
      - key: TATKAL_MAX_AGE_HOURS
        value: "24"
      - key: QUESTION_DRAFT_SHADOW_MODE
        value: "false"
