version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentsabha-postgres
    environment:
      POSTGRES_DB: agentsabha
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: agentsabha-redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: agentsabha-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    container_name: agentsabha-worker
    command: celery -A celery_worker.celery_app worker --loglevel=info
    env_file:
      - .env.example
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: agentsabha-frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:

